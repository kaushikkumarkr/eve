[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-mcp"
version = "0.1.0"
description = "MCP-first internal operating system for an AI advertising agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "mcp>=1.0.0,<2.0.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
agency = "agency_mcp.cli:app"
agency-mcp = "agency_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
