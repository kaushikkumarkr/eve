[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-mcp"
version = "0.1.0"
description = "MCP-first internal control plane for a ChatGPT Ads agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "mcp>=1.0.0,<2.0.0",
  "PyJWT[crypto]>=2.10.0",
  "cryptography>=42.0.0",
  "pydantic>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
azure = [
  "azure-identity>=1.17.0",
  "azure-keyvault-secrets>=4.9.0",
]

[project.scripts]
agency = "agency_mcp.cli:app"
agency-mcp = "agency_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agency_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"migrations" = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
