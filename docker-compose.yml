services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
    ports:
      - "55432:5432"
    volumes:
      - agency-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agency-postgres:
