services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
    ports:
      - "55432:5432"
    volumes:
      - agency-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 5s
      retries: 10

  agency:
    profiles: ["shared"]
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://agency:agency@postgres:5432/agency
      AGENCY_MCP_TRANSPORT: streamable-http
      AGENCY_MCP_HOST: 0.0.0.0
      AGENCY_MCP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agency-postgres:
